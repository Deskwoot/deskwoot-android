org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# File system watching missed edits made outside an IDE; a full check of this small tree is cheap.
org.gradle.vfs.watch=false
# The SDK's version, in this one place: the published artifact (com.deskwoot:deskwoot-android) and
# Deskwoot.SDK_VERSION, which the SDK sends to the server, both come from here.
deskwootSdkVersion=1.0.0
